name: PR Triage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number'
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    if: >-
      github.event_name != 'issue_comment' ||
      startsWith(github.event.comment.body, '/triage')
    runs-on: ubuntu-latest
    steps:
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: gmgm60/pr-triage@main
        with:
          pr: ${{ github.event.inputs.pr || '' }}
          full: 'true'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-triage-report
          path: |
            triage-report.md
            triage-report.html
            triage-result.json
          if-no-files-found: ignore
