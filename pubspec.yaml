name: zego_zimkit
description: A low-code plugin that provides a wrapper for IM widgets. Aims to simplify the development process by offering a user-friendly solution into applications.
version: 1.20.0
homepage: https://www.zegocloud.com/
screenshots:
  - description: "A full-featured chat kit that enables you to easily build one-on-one or group chat into your app in minutes."
    path: images/img_chat.png

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  zego_plugin_adapter: ^2.14.0
  zego_uikit_signaling_plugin: ^2.8.20
  zego_zim: ^2.28.0
  zego_zim_audio: ^1.0.0+1
  zego_zpns: ^2.8.0

  cupertino_icons: ^1.0.9
  equatable: ^2.1.0
  cached_network_image: ^3.4.1
  permission_handler: ^12.0.3
  encrypt: ^5.0.3
  flutter_logs_yoer: ^2.2.1
  async: ^2.13.1
  video_player: ^2.13.0
  file_picker: 12.0.0-beta.7
  chewie: ^1.14.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  plugin_platform_interface: ^2.1.8
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  import_sorter: ^4.6.0 # run 'flutter pub run import_sorter:main'
  lints: ^6.1.0

import_sorter:
  comments: false

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: com.zegocloud.uikit.zimkit_plugin
        pluginClass: ZegoUIKitZIMKitPlugin
      ios:
        pluginClass: ZegoUIKitZIMKitPlugin

linter:
  rules:
    public_member_api_docs: true